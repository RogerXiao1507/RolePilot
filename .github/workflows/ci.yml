name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      AUTH0_DOMAIN: rolepilot-test.us.auth0.com
      AUTH0_CLIENT_ID: test-client
      AUTH0_CLIENT_SECRET: test-secret
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_BASE_URL: http://localhost:3000
      AUTH0_AUDIENCE: https://api.rolepilot.test
      BACKEND_API_URL: http://localhost:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost/test
      OPENAI_API_KEY: test
      AUTH_ISSUER: https://rolepilot-test.auth0.com/
      AUTH_AUDIENCE: https://api.rolepilot.test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Report automated check count
        run: |
          echo "Automated checks in this workflow: 5 (frontend lint, frontend type check, frontend build, Alembic migration validation, backend pytest with coverage)"

      - name: Validate populated Phase 1 upgrade, schema, and rollback
        run: |
          alembic upgrade 0004_resume_library
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("""
                  INSERT INTO users (id, external_subject, email, name)
                  VALUES (
                    'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                    'auth0|migration-regression',
                    'migration@example.com',
                    'Migration Regression'
                  );
                  INSERT INTO resumes (
                    user_id, label, file_name, extracted_text, summary, strengths,
                    weaknesses, wording_issues, missing_metrics, suggested_improvements,
                    is_default, is_archived
                  ) VALUES (
                    'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                    'Existing Resume',
                    'existing.pdf',
                    'Existing resume text',
                    'Existing summary',
                    ARRAY['Python'],
                    ARRAY[]::varchar[],
                    ARRAY[]::varchar[],
                    ARRAY[]::varchar[],
                    ARRAY[]::varchar[],
                    true,
                    false
                  );
              """))
          PY
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run backend tests with coverage
        run: pytest --cov=app --cov-report=term-missing
